<?xml version="1.0" encoding="UTF-8"?>
<!--
fluxo.svg: loop de 14 s, uma única duração. Linha do tempo (segundos):
0 a 1,5   etapa 1 pedido: pacote pedido, Você para Orquestrador; Orquestrador acende (a partir de 1,3)
1,5 a 3,5 etapa 2 pesquisa: pacote buscar até scout (1,6 a 2,4); scout acende; pacote resumo volta (2,7 a 3,5)
3,5 a 5,5 etapa 3 código: pacote tarefa, Orquestrador para dev (3,7 a 4,6); dev acende (4,5 a 5,9) com o símbolo de código piscando
5,5 a 11  etapa 4 validação: pacote dev para tester (5,7 a 6,4); tester acende
7 a 8     selo FALHOU vermelho junto ao tester
8 a 9     pacote vermelho corrigir, tester para dev (8,05 a 8,85); dev acende de novo (8,8 a 9,6)
9 a 10    pacote dev para tester (9,05 a 9,9); tester acende
10 a 11   selo PASSOU verde
11 a 12,5 etapa 5 entrega: pacote verde entregue, tester para Orquestrador (11,05 a 11,85) e Orquestrador para Você (11,9 a 12,45); Você acende com o visto verde (12,4 a 13,4)
12,5 a 14 pausa; tudo apagado e volta ao estado inicial (etapa 1 reacende em 13,7)
Movimento reduzido: diagrama completo, sem pacotes, com PASSOU, visto e etapa 5 em destaque.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Diagrama animado do fluxo: você faz o pedido ao orquestrador, que consulta o scout, passa a tarefa ao dev e envia ao tester. O tester reprova, o dev corrige, o tester aprova e a entrega volta para você.">
<title>Como um pedido vira entrega: você, orquestrador, scout, dev e tester</title>
<defs>
<filter id="gr" x="-15%" y="-40%" width="130%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gp" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
