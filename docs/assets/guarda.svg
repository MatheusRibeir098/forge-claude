<g class="a k6" opacity="0"><rect x="-70" y="-13" width="140" height="26" rx="6" fill="#161B22" stroke="#F97316" stroke-width="1.5"/><text class="mn" x="0" y="4" text-anchor="middle" fill="#E6EDF3">Write src/App.tsx</text><rect class="a k7" x="-70" y="-13" width="140" height="26" rx="6" fill="none" stroke="#F85149" stroke-width="2" opacity="0"/></g>
<g class="a k8" opacity="0"><rect x="-42" y="-12" width="84" height="24" rx="6" fill="#161B22" stroke="#FBBF24" stroke-width="1.5"/><text class="mn" x="0" y="4" text-anchor="middle" fill="#FBBF24">briefing</text></g>
<g><rect x="45" y="228" width="250" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><circle cx="62" cy="245" r="3" fill="#FBBF24"/><text class="sb" x="76" y="250" style="fill:#E6EDF3">orquestrador não escreve código</text><rect class="a k9" x="45" y="228" width="250" height="34" rx="8" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0"/></g>
<g><rect x="315" y="228" width="250" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><circle cx="332" cy="245" r="3" fill="#FBBF24"/><text class="sb" x="346" y="250" style="fill:#E6EDF3">dev não valida a si mesmo</text><rect class="a k10" x="315" y="228" width="250" height="34" rx="8" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0"/></g>
<g><rect x="585" y="228" width="250" height="34" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><circle cx="602" cy="245" r="3" fill="#FBBF24"/><text class="sb" x="616" y="250" style="fill:#E6EDF3">teto de turnos por papel</text><rect class="a k11" x="585" y="228" width="250" height="34" rx="8" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0"/></g>
