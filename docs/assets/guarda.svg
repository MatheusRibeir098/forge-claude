<rect class="a k1" x="660" y="78" width="180" height="64" rx="12" fill="none" stroke="#F97316" stroke-width="2" filter="url(#gr)" opacity="0"/>
<g class="a k2"><path d="M440 66 L474 78 V110 C474 134 460 148 440 158 C420 148 406 134 406 110 V78 Z" fill="#161B22" stroke="#FBBF24" stroke-width="3" stroke-linejoin="round"/><text x="440" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, &apos;SF Mono&apos;, Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="13" font-weight="700" fill="#FBBF24">hook</text><path class="a k3" d="M440 66 L474 78 V110 C474 134 460 148 440 158 C420 148 406 134 406 110 V78 Z" fill="rgba(248,81,73,0.18)" stroke="#F85149" stroke-width="3" stroke-linejoin="round" filter="url(#gr)" opacity="0"/></g>
